<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{HOST}}/{{SLUG}}">
<meta name="robots" content="index,follow,max-image-preview:large">

<!-- Local -->
<meta name="geo.region" content="US-TX">
<meta name="geo.placename" content="Buda, Texas">

<!-- Open Graph / Twitter -->
<meta property="og:site_name" content="RacFit">
<meta property="og:locale" content="en_US">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{HOST}}/{{SLUG}}">
<meta property="og:image" content="{{HOST}}/assets/og/{{OG}}">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{TITLE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{DESC}}">
<meta name="twitter:image" content="{{HOST}}/assets/og/{{OG}}">
<meta name="twitter:image:alt" content="{{TITLE}}">

<meta name="theme-color" content="#295DA8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<link rel="manifest" href="assets/site.webmanifest">
<link rel="stylesheet" href="assets/css/racfit.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SportsActivityLocation",
  "@id": "{{HOST}}/#racfit",
  "name": "RacFit",
  "description": "Tennis, pickleball, fitness and social club in Buda, Texas, serving Buda, Kyle, San Marcos and South Austin. 8 tennis courts (2 indoor), 8 pickleball courts (4 covered), 2 fitness studios, a full-service bar and three on-site food trucks.",
  "url": "{{HOST}}/",
  "telephone": "+1-512-221-1926",
  "email": "contact@goracfit.com",
  "image": "{{HOST}}/assets/img/racfit-tennis-pickleball-fitness-club-buda-tx.jpg",
  "logo": "{{HOST}}/assets/logos/racfit-blue.png",
  "priceRange": "$$",
  "currenciesAccepted": "USD",
  "slogan": "Community. Health. Happiness.",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "1390 Robert S. Light Blvd",
    "addressLocality": "Buda",
    "addressRegion": "TX",
    "postalCode": "78610",
    "addressCountry": "US"
  },
  "areaServed": [
    { "@type": "City", "name": "Buda", "addressRegion": "TX" },
    { "@type": "City", "name": "Kyle", "addressRegion": "TX" },
    { "@type": "City", "name": "San Marcos", "addressRegion": "TX" },
    { "@type": "City", "name": "Austin", "addressRegion": "TX" }
  ],
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
    "opens": "06:00",
    "closes": "22:00"
  }],
  "sport": ["Tennis","Pickleball","Fitness"],
  "amenityFeature": [
    { "@type": "LocationFeatureSpecification", "name": "Indoor tennis courts", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Covered pickleball courts", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Group fitness studios", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Full-service bar", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "On-site childcare", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Locker rooms", "value": true },
    { "@type": "LocationFeatureSpecification", "name": "Food trucks", "value": true }
  ],
  "sameAs": [
    "https://www.facebook.com/GoRacFit",
    "https://www.instagram.com/goracfit/",
    "https://www.racfitfoundation.org/"
  ],
  "potentialAction": {
    "@type": "ReserveAction",
    "target": { "@type": "EntryPoint", "urlTemplate": "https://book.goracfit.com" },
    "name": "Book a court"
  }
}
</script>
<!-- Cloudflare Turnstile. Loaded on every page rather than per form so the
     widget is warm by the time a visitor reaches one. Defers, so it never
     blocks render. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  /* Honeypot field: off-canvas rather than display:none, because some bots skip
     hidden inputs but fill positioned ones. Never focusable by a person. */
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body class="no-js">
<script>document.body.classList.remove("no-js");</script>
